<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006C4C"/>
      <stop offset="100%" stop-color="#003825"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE28A"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Islamic Floral/Star Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="6" stroke-dasharray="8 6" opacity="0.45"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.6"/>

  <!-- Top Crescent & Dome -->
  <path d="M256 75 A 22 22 0 0 1 274 100 A 18 18 0 1 0 252 75" fill="url(#gold)" filter="url(#glow)"/>
  <path d="M256 106 L278 148 L234 148 Z" fill="url(#gold)"/>
  <rect x="246" y="148" width="20" height="42" fill="url(#gold)"/>

  <!-- Cinema Reel / Video Screen Frame -->
  <rect x="146" y="200" width="220" height="160" rx="24" fill="#121316" stroke="url(#gold)" stroke-width="8" filter="url(#glow)"/>
  
  <!-- Video Film Perforations -->
  <rect x="162" y="212" width="12" height="12" rx="3" fill="url(#gold)" opacity="0.7"/>
  <rect x="186" y="212" width="12" height="12" rx="3" fill="url(#gold)" opacity="0.7"/>
  <rect x="314" y="212" width="12" height="12" rx="3" fill="url(#gold)" opacity="0.7"/>
  <rect x="338" y="212" width="12" height="12" rx="3" fill="url(#gold)" opacity="0.7"/>
  <rect x="162" y="336" width="12" height="12" rx="3" fill="url(#gold)" opacity="0.7"/>
  <rect x="186" y="336" width="12" height="12" rx="3" fill="url(#gold)" opacity="0.7"/>
  <rect x="314" y="336" width="12" height="12" rx="3" fill="url(#gold)" opacity="0.7"/>
  <rect x="338" y="336" width="12" height="12" rx="3" fill="url(#gold)" opacity="0.7"/>

  <!-- Islamic Minaret Crescent Play Button -->
  <polygon points="238,245 304,280 238,315" fill="url(#gold)"/>

  <!-- Calligraphy Flourish Accent -->
  <path d="M176 395 C 220 425, 292 425, 336 395" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="256" cy="420" r="4" fill="url(#gold)"/>
</svg>
